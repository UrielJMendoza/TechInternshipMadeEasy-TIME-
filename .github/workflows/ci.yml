name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

# This workflow validates local artifacts only. It must never deploy or mutate production.
jobs:
  quality:
    name: Quality and unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run ingest:artifact:check
      - run: npm run test:coverage
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_local_ci_placeholder
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      - name: Upload build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: |
            .next/diagnostics/
            .next/trace
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  database:
    name: Supabase reset, permissions, and types
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Start local Supabase
        run: npx --no-install supabase start
      - run: npm run test:db
      - run: npx --no-install supabase db lint --local --level error --fail-on error
      - run: npm run types:check
      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx --no-install supabase stop --no-backup
      - name: Upload Supabase diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-diagnostics
          path: supabase/.temp/pgdelta/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser, accessibility, and performance
    needs: [quality, build, database]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Start and reset local Supabase
        run: |
          npx --no-install supabase start
          npx --no-install supabase db reset --local --sql-paths ../e2e/fixtures.sql
      - name: Export local-only Supabase environment
        shell: bash
        run: |
          npx --no-install supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          LOCAL_API_URL="${API_URL:-${SUPABASE_URL:-}}"
          LOCAL_PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$LOCAL_API_URL"
          test -n "$LOCAL_PUBLIC_KEY"
          test -n "$LOCAL_SECRET_KEY"

          case "$LOCAL_API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *)
              echo "Refusing to run browser CI against non-local Supabase URL" >&2
              exit 1
              ;;
          esac

          echo "::add-mask::$LOCAL_SECRET_KEY"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$LOCAL_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$LOCAL_PUBLIC_KEY"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$LOCAL_PUBLIC_KEY"
            echo "SUPABASE_URL=$LOCAL_API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$LOCAL_PUBLIC_KEY"
            echo "SUPABASE_ANON_KEY=$LOCAL_PUBLIC_KEY"
            echo "SUPABASE_SECRET_KEY=$LOCAL_SECRET_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SECRET_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e
      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx --no-install supabase stop --no-backup
      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
