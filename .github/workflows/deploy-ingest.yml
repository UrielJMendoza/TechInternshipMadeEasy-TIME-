name: Deploy ingest function

# Deploy the importer Edge Function from the reviewed repository source with the
# Supabase CLI, then record its checksum as the expected code version. Runs when
# the production branch changes the function, or on demand.
on:
  push:
    branches: [claude/internship-tracker-app-05orfv]
    paths: ['supabase/functions/ingest/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: ogkocdharscqzdrnlpnq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Require a current source checksum
        run: |
          node scripts/build-ingest-manifest.mjs
          git diff --exit-code supabase/functions/ingest/manifest.ts

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Test the importer
        run: deno test --allow-env --allow-read --config supabase/functions/ingest/deno.json --node-modules-dir=none supabase/functions/ingest/ingest.test.ts supabase/functions/ingest/evidence.test.ts supabase/functions/ingest/simplify.test.ts

      - name: Stop without deployment credentials
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Set the SUPABASE_ACCESS_TOKEN secret (a Supabase personal access token) to deploy the importer from CI."

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.118.0

      - name: Deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy ingest --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Confirm the deployed version and record it
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          checksum=$(sed -n 's/.*INGEST_SOURCE_CHECKSUM = "\([0-9a-f]\{64\}\)".*/\1/p' supabase/functions/ingest/manifest.ts)
          test -n "$checksum"
          # The function reports its checksum even on unauthorized requests.
          for attempt in 1 2 3 4 5 6; do
            served=$(curl -sS -o /dev/null -D - -X POST "https://$PROJECT_REF.supabase.co/functions/v1/ingest" \
              | tr -d '\r' | sed -n 's/^x-ingest-code-version: //Ip' || true)
            [ "$served" = "$checksum" ] && break
            echo "Waiting for the new version (serving '${served:-none}')..."
            sleep 10
          done
          if [ "$served" != "$checksum" ]; then
            echo "::error::The function serves '${served:-none}', expected $checksum"
            exit 1
          fi
          curl --fail -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"update app_meta.ingest_settings set expected_ingest_code_version = '$checksum', updated_at = now() where singleton\"}" > /dev/null
          echo "Deployed and recorded importer $checksum"
