name: Public feed health

on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-feed-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/check-public-health.mjs
